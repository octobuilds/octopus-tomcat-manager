<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <!-- Background -->
  <rect width="800" height="160" rx="12" fill="#ECEEF4"/>

  <!-- Octopus logo (referenced via raw GitHub URL) -->
  <image href="https://raw.githubusercontent.com/octobuilds/octopus-tomcat-manager/main/frontend/public/logo.png"
         x="30" y="10" width="140" height="140"/>

  <!-- OctopusAPM gradient text -->
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#8B6FD4"/>
    </linearGradient>
  </defs>
  <text x="195" y="108"
        font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif"
        font-size="76"
        font-weight="bold"
        fill="url(#textGrad)"
        letter-spacing="-2">OctopusAPM</text>
</svg>
